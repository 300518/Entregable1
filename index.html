<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entregable1+Cabezas - Turno de Banco</title>
    <!--llamada bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
     <!--llamada estilos, esto es nuevo-->
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body class="p-4">
    <main class="container">
      <h1 class="mb-3">Simulador: Turno de atención Ejecutivo Banco</h1>
      <div class="row g-3">
        <div class="col-md-5">
          <div class="card p-3">
            <h5>Sacar turno</h5>
            <form id="form-sacar-turno" class="mb-2">
              <div class="mb-2">
                <label for="nombre-input" class="form-label">Nombre</label>
                <input
                  id="nombre-input"
                  class="form-control"
                  type="text"
                  placeholder="Ingresa nombre"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">Sacar turno</button>
            </form>
            <div class="my-3">
              <h6>Acciones rápidas</h6>
              <button id="btn-atender" class="btn btn-success mb-2 w-100">
                Atender siguiente
              </button>
              <button
                id="btn-llenar-prueba"
                class="btn btn-outline-secondary mb-2 w-100"
              >
                Llenar cola de prueba
              </button>
              <button id="btn-limpiar" class="btn btn-danger w-100">
                Resetear simulador
              </button>
            </div>
            <div class="mt-3">
              <h6>Cancelar turno (por número)</h6>
              <form id="form-cancelar-turno" class="d-flex gap-2">
                <input
                  id="cancel-num-input"
                  class="form-control"
                  type="number"
                  placeholder="N° turno"
                  min="1"
                  required
                />
                <button type="submit" class="btn btn-warning">Cancelar</button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-md-7">
          <div class="card p-3 mb-3">
            <h5>Cola de turnos</h5>
            <div id="cola-list" class="list-group" style="min-height: 120px">
            </div>
          </div>
          <div class="card p-3">
            <h5>Estadísticas</h5>
            <ul class="list-group">
              <li class="list-group-item">
                Siguiente número: <span id="siguiente-num">1</span>
              </li>
              <li class="list-group-item">
                Total atendidos: <span id="total-atendidos">0</span>
              </li>
              <li class="list-group-item">
                Turnos pendientes: <span id="pendientes">0</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </main>
    <script src="js/turno.js"></script>
  </body>
</html>
